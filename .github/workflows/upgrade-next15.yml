name: Upgrade Kiwango to Next.js 15 Maintenance LTS

on:
  push:
    branches:
      - chore/kiwango-next15-security
    paths:
      - '.github/workflows/upgrade-next15.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: chore/kiwango-next15-security
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Maintenance LTS security versions
        run: |
          npm install --save-exact next@15.5.21 eslint-config-next@15.5.21
          npm install react@19 react-dom@19

      - name: Verify generated dependency tree
        run: |
          npm ls next react react-dom eslint-config-next
          npm run lint
          npm run build

      - name: Commit generated package files
        run: |
          rm .github/workflows/upgrade-next15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/upgrade-next15.yml
          git commit -m 'Upgrade Kiwango to Next.js 15.5.21 security LTS'
          git push origin HEAD:chore/kiwango-next15-security
