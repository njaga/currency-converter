name: Upgrade Kiwango to Next.js 16 Active LTS

on:
  pull_request:
    branches:
      - feat/kiwango-v1-release-candidate
    paths:
      - '.github/workflows/upgrade-next16.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.ref == 'chore/kiwango-next16-security'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: chore/kiwango-next16-security
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install Next 16 Active LTS
        run: |
          npm install --save-exact next@16.3.0 eslint-config-next@16.3.0 eslint@9.39.1

      - name: Migrate lint command
        run: |
          npm pkg set scripts.lint='eslint .'
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from 'eslint/config';
          import nextVitals from 'eslint-config-next/core-web-vitals';

          export default defineConfig([
            ...nextVitals,
            globalIgnores(['.next/**', 'out/**', 'build/**', 'next-env.d.ts']),
          ]);
          EOF
          rm -f .eslintrc.json

      - name: Verify dependency tree and app
        run: |
          npm ls next react react-dom framer-motion recharts eslint eslint-config-next
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Production smoke test
        run: |
          npm run start -- -p 3000 > /tmp/kiwango-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/kiwango-next.log' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/app > /dev/null
          curl -fsS http://127.0.0.1:3000/mentions-legales > /dev/null

      - name: Commit generated migration
        run: |
          rm .github/workflows/upgrade-next16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json eslint.config.mjs .eslintrc.json .github/workflows/upgrade-next16.yml
          git commit -m 'Upgrade Kiwango to Next.js 16.3.0 Active LTS'
          git push origin HEAD:chore/kiwango-next16-security
