name: Kiwango CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/kiwango-v1-release-candidate

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: |
          npm run start -- -p 3000 > /tmp/kiwango-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/kiwango-next.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          # Public pages
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/app > /dev/null
          curl -fsS http://127.0.0.1:3000/mentions-legales > /dev/null

          # Missing optional server configuration must fail in a controlled way.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/countries)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/rates)" = "503"

          # Invalid input must be rejected before any upstream request.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/rates?base=INVALID')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/historical-rates?base=EUR!&quote=XOF')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/nearby-finance?lat=999&lon=0')" = "400"

          # Unknown affiliate services must stay inside Kiwango rather than redirect externally.
          LOCATION=$(curl -sI 'http://127.0.0.1:3000/go/not-a-service' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          test "$LOCATION" = "/app?tab=travel&affiliate=invalid-service&service=not-a-service"
